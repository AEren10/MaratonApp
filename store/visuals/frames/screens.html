<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Maraton ekran mock</title>
<style>
  @font-face { font-family: Bricolage; src: url(../../../assets/fonts/Bricolage_400.ttf); }
  @font-face { font-family: Archivo; src: url(../../../assets/fonts/Archivo_400.ttf); font-weight: 400; }
  @font-face { font-family: Archivo; src: url(../../../assets/fonts/Archivo_500.ttf); font-weight: 500; }
  @font-face { font-family: Archivo; src: url(../../../assets/fonts/Archivo_600.ttf); font-weight: 600; }
  @font-face { font-family: Archivo; src: url(../../../assets/fonts/Archivo_700.ttf); font-weight: 700; }
  :root {
    --bg:#1C1C23; --surface:#28282F; --elev:#35353B; --void:#212129; --track:#30303B; --line:#3A3A42; --border:#5A5961;
    --text:#ECE8E4; --text2:#B0ADB5; --text3:#A3A0AB; --accent:#E5343F; --bright:#FF6A72; --up:#34D399; --flame:#F28C38;
    --tur:#74A9E8; --mat:#E0A570; --fiz:#56C6D6; --kim:#E8A0C4; --bio:#7FCB7A; --ing:#7DD3F7; --fel:#A78BFA;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--text); font-family:Archivo; -webkit-font-smoothing:antialiased; }
  .scr { position:relative; width:390px; height:844px; overflow:hidden; background:var(--bg); }
  .glow { position:absolute; inset:0; background:radial-gradient(circle at 85% -5%, rgba(229,52,63,.20), transparent 45%); pointer-events:none; }
  .status { height:47px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 6px 34px; font:600 16px Archivo; }
  .status .r { display:flex; gap:6px; align-items:center; }
  .bat { width:25px; height:12px; border:1.5px solid var(--text); border-radius:4px; position:relative; }
  .bat:after { content:''; position:absolute; inset:1.5px; background:var(--text); border-radius:2px; }
  .pad { padding:0 21px; }
  .label { font:600 11.5px Archivo; letter-spacing:.16em; text-transform:uppercase; color:var(--text3); }
  .bric { font-family:Bricolage; letter-spacing:-.03em; }
  .row { display:flex; align-items:center; }
  .between { display:flex; align-items:center; justify-content:space-between; }
  .tab { position:absolute; left:14px; right:14px; bottom:26px; height:62px; border-radius:31px; background:var(--surface); border:1px solid #44444C; display:flex; align-items:center; justify-content:space-around; padding:0 6px; }
  .ti { width:62px; display:flex; flex-direction:column; align-items:center; gap:3px; font:500 11px Archivo; color:var(--text3); }
  .ti.on { color:var(--bright); }
  .ti.onbg { background:rgba(229,52,63,.14); border:1px solid rgba(229,52,63,.35); border-radius:22px; padding:5px 0; width:72px; }
  .fab { width:52px; height:52px; border-radius:26px; background:var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 0 22px rgba(229,52,63,.45); }
  .chip { display:inline-flex; align-items:center; gap:6px; }
  .seg { display:flex; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px; }
  .seg div { flex:1; text-align:center; font:600 13px Archivo; color:var(--text3); padding:8px 0; border-radius:7px; }
  .seg .on { background:var(--elev); color:var(--text); }
  .hr { height:1px; background:var(--line); }
  .stat4 { display:flex; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .stat4 > div { flex:1; text-align:center; padding:14px 0; border-right:1px solid var(--line); }
  .stat4 > div:last-child { border-right:0; }
  .stat4 b { display:block; font:400 26px Bricolage; letter-spacing:-.02em; }
  .stat4 span { font:500 12.5px Archivo; color:var(--text3); }
  .link { padding:16px 0; border-bottom:1px solid var(--line); }
  .link b { font:600 15px Archivo; display:block; } .link span { font:400 13px Archivo; color:var(--text3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const TAB = (on) => {
  const it = (k, l, svg) => `<div class="ti ${on===k?'on onbg':''}">${svg}<div>${l}</div></div>`;
  const s = (d, c) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="${on===c?'rgba(255,106,114,.3)':'none'}" stroke="${on===c?'#FF6A72':'#A3A0AB'}" stroke-width="${on===c?2.1:1.7}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  return `<div class="tab">
    ${it('home','Ana Sayfa', s('<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>','home'))}
    ${it('prog','Program', s('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>','prog'))}
    <div class="fab"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
    ${it('an','Analiz', on==='an' ? s('<path d="M4 17l5-5 5 3 7-7v13H4z"/>','an') : s('<line x1="3" y1="21" x2="21" y2="21"/><polyline points="4 17 9 12 14 15 21 8"/>','an'))}
    ${it('pro','Profil', s('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>','pro'))}
  </div>`;
};
const STATUS = `<div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" fill="#ECE8E4"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 24 17" fill="none" stroke="#ECE8E4" stroke-width="2.6" stroke-linecap="round"><path d="M2 6a14 14 0 0 1 20 0"/><path d="M6 10a8.5 8.5 0 0 1 12 0"/><circle cx="12" cy="14" r="1.6" fill="#ECE8E4"/></svg><span class="bat"></span></span></div>`;
const BACK = (t, dot) => `<div class="pad row" style="gap:14px;margin-top:20px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B0ADB5" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>${dot?`<span style="width:12px;height:12px;border-radius:3px;background:${dot}"></span>`:''}<span class="bric" style="font-size:32px">${t}</span></div>`;

// Egri: noktalardan yumusak path
const smooth = (pts) => pts.reduce((d,[x,y],i,a)=>{ if(!i) return `M${x},${y}`; const [px,py]=a[i-1]; const mx=(px+x)/2; return d+` C${mx},${py} ${mx},${y} ${x},${y}`; },'');
const poly = (pts) => pts.map(([x,y],i)=>(i?'L':'M')+x+','+y).join(' ');

const S = {};

S.home = () => {
  const days=['Pt','Sa','Ça','Pe','Cu','Ct','Pa']; const mins=[130,185,95,125,195,75,0]; const goal=165;
  const H=210, B=225, top=B-H; const y=(m)=>B-(m/220)*H; const W=46, gap=48, x0=62;
  const hatch=`<pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#E5343F" stroke-width="1.6"/></pattern>`;
  let bars='';
  days.forEach((d,i)=>{ const x=x0+i*gap; const today=i===5, fut=i===6;
    if(today||fut) bars+=`<rect x="${x}" y="${y(goal)}" width="${W-14}" height="${B-y(goal)}" rx="3" fill="${fut?'#212129':'#30303B'}" stroke="${today?'#E5343F':'#3A3A42'}" stroke-opacity="${today?.6:.4}" stroke-dasharray="${fut?'4 3':''}"/><rect x="${x}" y="${y(goal)}" width="${W-14}" height="${B-y(goal)}" rx="3" fill="url(#h)" opacity="${today?.35:.18}"/>`;
    if(mins[i]>0){ bars+=`<rect x="${x}" y="${y(mins[i])}" width="${W-14}" height="${B-y(mins[i])}" rx="3" fill="#E5343F"/>`;
      const lbl=mins[i]>=60?`${Math.floor(mins[i]/60)}s ${mins[i]%60?mins[i]%60+'d':''}`.trim():mins[i]+'d';
      bars+=`<text x="${x+(W-14)/2}" y="${y(mins[i])-7}" fill="${mins[i]>=goal?'#34D399':today?'#ECE8E4':'#B0ADB5'}" font-family="Archivo" font-weight="600" font-size="11" text-anchor="middle">${lbl}</text>`; }
    bars+=`<text x="${x+(W-14)/2}" y="${B+24}" fill="${today?'#FF6A72':'#A3A0AB'}" font-family="Archivo" font-weight="${today?700:500}" font-size="12" text-anchor="middle">${d}</text>`;
  });
  const grid=[60,120,180].map(m=>`<line x1="44" x2="370" y1="${y(m)}" y2="${y(m)}" stroke="#2E2E36"/><text x="30" y="${y(m)+4}" fill="#827F88" font-size="11" font-family="Archivo">${m/60}s</text>`).join('');
  return `<div class="scr"><div class="glow"></div>${STATUS}
  <div class="pad between" style="margin-top:10px"><div class="row" style="gap:12px"><div style="width:44px;height:44px;border-radius:12px;background:var(--elev);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font:700 17px Archivo;color:var(--bright)">DE</div><div><div class="label" style="font-size:10.5px">İYİ AKŞAMLAR</div><div style="font:500 18px Archivo;margin-top:2px">Deniz</div></div></div>
  <div class="row" style="gap:9px">${['<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>','<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'].map(p=>`<div style="width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0ADB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg></div>`).join('')}</div></div>
  <div class="pad bric" style="font-size:26px;margin-top:18px">Salı, 14 Ekim</div>
  <div class="pad row" style="gap:12px;margin-top:12px"><div style="width:38px;height:38px;border-radius:19px;background:rgba(242,140,56,.16);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#F28C38"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 0-6 0-9z"/></svg></div><div><div style="font:500 15px Archivo"><span class="bric" style="color:var(--flame);font-size:20px">12</span> günlük seri</div><div style="font:400 12.5px Archivo;color:var(--text3)">Bu hafta 5/7 gün</div></div></div>
  <div class="pad between" style="margin-top:22px;align-items:flex-end"><div><div class="label">BUGÜN ÇÖZÜLEN</div><div style="margin-top:4px"><span class="bric" style="font-size:44px">64</span><span style="color:var(--text3);font-size:14px"> /80</span></div></div><div style="text-align:right"><div class="label">YKS 2027</div><div style="margin-top:4px"><span class="bric" style="font-size:44px">244</span><span style="color:var(--text2);font-size:16px"> gün</span></div></div></div>
  <svg width="390" height="262" style="margin-top:4px"><defs>${hatch}</defs>${grid}<line x1="44" x2="352" y1="${y(goal)}" y2="${y(goal)}" stroke="#A3A0AB" stroke-dasharray="5 4" stroke-opacity=".7"/><path d="M356 ${y(goal)} v-26 l16 6 -16 6" fill="#E5343F" stroke="#E5343F" stroke-width="1.5"/>${bars}</svg>
  <div class="pad" style="margin-top:2px"><span class="bric" style="font-size:30px">14 sa 25 dk</span><div style="font:400 13px Archivo;color:var(--text3)">bu hafta çalıştın</div></div>
  <div class="pad" style="margin-top:18px"><div style="background:#CF2833;border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between"><div><div style="font:700 20px Archivo">Çalışmaya Başla</div><div style="font:500 13px Archivo;color:rgba(255,255,255,.8);margin-top:3px">Matematik · Problemler · 40 dk</div></div><div style="width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg></div></div></div>
  ${TAB('home')}</div>`;
};

S.rota = () => {
  const pts=[[24,250],[74,236],[124,242],[174,214],[224,196],[274,182],[318,170]];
  const proj=[[318,170],[350,128],[368,92]];
  const area=smooth(pts)+` L318,300 L24,300 Z`;
  const beacons=pts.slice(0,-1).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="#FF6A72" stroke-opacity=".35" stroke-width="1.5"/>`).join('');
  const dates=['22/09','29/09','03/10','06/10','09/10','11/10','14/10'];
  const why=[['#A78BFA','Felsefe','Felsefeye Giriş','Son denemelerinde bu alanda zorlandın; o yüzden öne alındı.','💡'],['#74A9E8','Türkçe','Paragraf (Yapı)','Geçmiş sınavlarda bu konudan sık soru geldi; getirisi yüksek.','📖'],['#E0A570','Matematik','Problemler','Doğruluğun %58; 30 soru daha ile konu oturur.','∑']];
  return `<div class="scr"><div class="glow"></div>${STATUS}${BACK('Rota')}
  <div class="pad" style="margin-top:26px"><div class="label" style="color:var(--text2)">NET ORTALAMASI</div><div style="font:400 13.5px Archivo;color:var(--text3);margin-top:6px">7 deneme · <span style="color:var(--bright)">Detay için noktalara dokun</span></div></div>
  <svg width="390" height="330" style="margin-top:6px"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5343F" stop-opacity=".30"/><stop offset="1" stop-color="#E5343F" stop-opacity="0"/></linearGradient></defs>
  <text x="24" y="70" fill="#E8A0A4" font-family="Archivo" font-weight="600" font-size="11.5" letter-spacing="1.8">HEDEF 78</text>
  <line x1="20" x2="360" y1="92" y2="92" stroke="#E5343F" stroke-opacity=".55" stroke-dasharray="5 5"/>
  ${[150,210,270].map(y=>`<line x1="20" x2="370" y1="${y}" y2="${y}" stroke="#2E2E36"/>`).join('')}
  <path d="${area}" fill="url(#a)"/>
  <path d="${smooth(pts)}" fill="none" stroke="#E5343F" stroke-width="3.2" stroke-linecap="round"/>
  <path d="${poly(proj)}" fill="none" stroke="#E5343F" stroke-width="3" stroke-dasharray="1 8" stroke-linecap="round"/>
  ${beacons}${pts.slice(0,-1).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6" fill="#1C1C23" stroke="#E5343F" stroke-width="2.6"/>`).join('')}
  <circle cx="318" cy="170" r="16" fill="#E5343F" opacity=".2"/><circle cx="318" cy="170" r="9" fill="#E5343F"/>
  <text x="340" y="216" fill="#FF6A72" font-family="Archivo" font-weight="700" font-size="12" letter-spacing="2" text-anchor="end">BUGÜN · 68</text>
  <circle cx="368" cy="92" r="9" fill="#1C1C23" stroke="#E8A0A4" stroke-width="2.5"/><path d="M368 83 v-24 l16 6 -16 6" fill="#E5343F" stroke="#E5343F" stroke-width="1.5"/>
  ${pts.map(([x],i)=>`<text x="${x}" y="322" fill="#A3A0AB" font-family="Archivo" font-size="10.5" text-anchor="middle">${dates[i]}</text>`).join('')}
  </svg>
  <div class="pad" style="text-align:right;font:600 11.5px Archivo;letter-spacing:.16em;color:var(--text3)">15 HAZ 2027</div>
  <div class="pad" style="margin-top:22px"><div class="label" style="color:var(--text2)">BU HAFTA NEDEN BU DURAKLAR</div><div style="font:400 13.5px Archivo;color:var(--text2);margin-top:6px">Rotan denemelerine, yanlışlarına ve tempona bakıp seçti.</div></div>
  <div class="pad" style="margin-top:12px">${why.map(([c,s,t,d])=>`<div class="row" style="gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start"><div style="width:42px;height:42px;border-radius:21px;background:${c}26;flex-shrink:0;display:flex;align-items:center;justify-content:center"><span style="width:12px;height:12px;border-radius:3px;background:${c}"></span></div><div><div style="font:600 15.5px Archivo"><span style="color:${c}">${s}</span> · ${t}</div><div style="font:400 13.5px/1.45 Archivo;color:var(--text2);margin-top:3px">${d}</div></div></div>`).join('')}</div>
  ${TAB('home')}</div>`;
};

S.analiz = () => {
  const tyt=[[30,148],[76,130],[122,141],[168,114],[214,124],[260,96],[306,105],[340,78]];
  const tur=[[24,64],[78,48],[132,58],[186,38],[240,47],[294,29],[334,24]];
  return `<div class="scr"><div class="glow"></div>${STATUS}
  <div class="pad bric" style="font-size:32px;margin-top:20px">Analiz</div>
  <div class="pad" style="margin-top:16px"><div class="seg"><div class="on">Tümü</div><div>TYT</div><div>AYT</div><div>Branş</div></div></div>
  <div class="pad" style="margin-top:22px"><div class="label">TYT DENEMESİ · 11 EKİM 2026</div><div class="row" style="gap:12px;align-items:flex-end;margin-top:4px"><span class="bric" style="font-size:72px;line-height:1">68,25</span><span style="color:var(--up);font:600 16px Archivo;margin-bottom:12px">↗ +4,50</span></div></div>
  <div class="pad row" style="gap:16px;margin-top:14px;font:500 13px Archivo;color:var(--text2)"><span class="row" style="gap:6px"><span style="width:9px;height:9px;border-radius:5px;background:var(--accent)"></span>TYT</span><span class="row" style="gap:6px"><span style="width:9px;height:9px;border-radius:5px;background:var(--fiz)"></span>AYT Say</span></div>
  <svg width="390" height="190" style="margin-top:6px">${[40,90,140].map(y=>`<line x1="40" x2="370" y1="${y}" y2="${y}" stroke="#2E2E36"/>`).join('')}
  ${[['70',44],['60',94],['50',144]].map(([t,y])=>`<text x="20" y="${y}" fill="#827F88" font-size="11" font-family="Archivo">${t}</text>`).join('')}
  <path d="${smooth(tyt.map(([x,y])=>[x+18,y]))}" fill="none" stroke="#E5343F" stroke-width="3" stroke-linecap="round"/>
  ${tyt.map(([x,y],i)=>`<circle cx="${x+18}" cy="${y}" r="${i===tyt.length-1?7:5}" fill="${i===tyt.length-1?'#E5343F':'#1C1C23'}" stroke="#E5343F" stroke-width="2.4"/>`).join('')}
  <path d="${smooth([[200,172],[245,158],[290,167],[336,148]])}" fill="none" stroke="#56C6D6" stroke-width="2.6" stroke-linecap="round"/>
  ${[[200,172],[245,158],[290,167],[336,148]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="#1C1C23" stroke="#56C6D6" stroke-width="2.4"/>`).join('')}
  <text x="58" y="186" fill="#A3A0AB" font-size="11" font-family="Archivo" letter-spacing="1.5">1 EYL</text><text x="370" y="186" fill="#A3A0AB" font-size="11" font-family="Archivo" text-anchor="end" letter-spacing="1.5">11 EKİ</text></svg>
  <div class="pad label" style="margin-top:14px">DERS BAZLI TREND</div>
  <div class="pad" style="margin-top:12px"><div style="background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px">
    <div class="between"><span class="row" style="gap:8px;font:600 16px Archivo"><span style="width:11px;height:11px;border-radius:3px;background:var(--tur)"></span>Türkçe</span><span class="row" style="gap:10px"><span class="bric" style="font-size:28px">31,25</span><span style="background:rgba(52,211,153,.12);color:var(--up);font:600 12.5px Archivo;padding:5px 9px;border-radius:7px">↗ +2,50</span></span></div>
    <svg width="324" height="72" style="margin-top:8px"><defs><linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74A9E8" stop-opacity=".35"/><stop offset="1" stop-color="#74A9E8" stop-opacity="0"/></linearGradient></defs><path d="${smooth(tur.map(([x,y])=>[x-20,y]))} L314,72 L4,72 Z" fill="url(#t)"/><path d="${smooth(tur.map(([x,y])=>[x-20,y]))}" fill="none" stroke="#74A9E8" stroke-width="2.6"/><circle cx="314" cy="24" r="5.5" fill="#74A9E8"/></svg>
    <div class="between" style="font:400 13px Archivo;color:var(--text2);margin-top:6px"><span>24,50 en düşük</span><span>31,25 en yüksek</span></div></div></div>
  <div class="pad" style="margin-top:12px"><div style="background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;height:80px"><div class="between"><span class="row" style="gap:8px;font:600 16px Archivo"><span style="width:11px;height:11px;border-radius:3px;background:var(--mat)"></span>Matematik</span><span class="bric" style="font-size:28px">21,50</span></div></div></div>
  <div style="position:absolute;right:21px;bottom:100px;background:#CF2833;border-radius:28px;padding:14px 22px;font:700 17px Archivo;box-shadow:0 6px 20px rgba(0,0,0,.4)">＋ Deneme gir</div>

const s = new URLSearchParams(location.search).get('s') || 'home';

// Tanitim videosu (store/visuals/video) icin: grafikleri p=0..1 arasi cizer.
window.applyProgress = (p) => {
  document.querySelectorAll('#root svg').forEach((svg) => {
    const w = svg.width.baseVal.value;
    if (w < 100) return;
    svg.querySelectorAll('path').forEach((el) => {
      if (el.getAttribute('fill') === 'none' && !el.getAttribute('stroke-dasharray')) {
        const L = el.getTotalLength();
        el.style.strokeDasharray = L; el.style.strokeDashoffset = L * (1 - p);
      } else el.style.opacity = Math.max(0, (p - 0.6) / 0.4);
    });
    svg.querySelectorAll('circle').forEach((el) => { el.style.opacity = (+el.getAttribute('cx') / w) <= p + 0.02 ? 1 : 0; });
    svg.querySelectorAll('rect').forEach((el) => { el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'bottom'; el.style.transform = `scaleY(${p})`; });
  });
};
document.fonts.ready.then(() => { document.title = 'ready'; });
