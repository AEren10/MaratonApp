<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Maraton feature graphic</title>
<style>
  @font-face { font-family: Bricolage; src: url(../../../assets/fonts/Bricolage_400.ttf); }
  @font-face { font-family: Unbounded; src: url(../../../assets/fonts/Unbounded_600.ttf); font-weight: 600; }
  @font-face { font-family: Archivo; src: url(../../../assets/fonts/Archivo_500.ttf); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; background: #1C1C23; position: relative; color: #ECE8E4; }
  /* Zemin: sagdaki telefonlarin arkasinda kizil hale, solda silik ikinci isik. */
  .bg { position: absolute; inset: 0;
    background: radial-gradient(circle at 74% 55%, rgba(229,52,63,.42), transparent 44%),
                radial-gradient(circle at 8% 0%, rgba(229,52,63,.20), transparent 40%); }
  .brand { position: absolute; left: 64px; top: 78px; display: flex; align-items: center; gap: 14px; }
  .brand img { height: 30px; }
  .brand span { font: 600 23px Unbounded; letter-spacing: .04em; }
  h1 { position: absolute; left: 64px; top: 150px; font: 400 68px/.98 Bricolage; letter-spacing: -.04em; }
  h1 em { font-style: normal; color: #E5343F; display: block; }
  p { position: absolute; left: 66px; top: 306px; width: 420px; font: 500 21px/1.4 Archivo; color: #B0ADB5; }
  .tags { position: absolute; left: 64px; top: 392px; display: flex; gap: 10px; }
  .tags span { font: 500 15px Archivo; color: #ECE8E4; padding: 8px 14px; border-radius: 8px;
    background: rgba(40,40,47,.9); border: 1px solid #44444C; }
  .phone { position: absolute; width: 236px; height: 511px; border-radius: 38px; background: #0E0E12;
    border: 1px solid #5A5961; padding: 7px; overflow: hidden; }
  .phone img { width: 100%; border-radius: 31px; display: block; }
  .back { left: 742px; top: 96px; transform: rotate(7deg); opacity: .96; }
  .front { left: 560px; top: 44px; transform: rotate(-5deg); }
</style></head>
<body>
  <div class="bg"></div>
  <div class="brand"><img src="../../../assets/brand/mark.png" alt=""><span>MARATON</span></div>
  <h1>Her sabah<em>rotan hazır.</em></h1>
  <p>YKS ve LGS için günlük çalışma planı, deneme takibi ve net analizi.</p>
  <div class="tags"><span>Günlük rota</span><span>Net grafiği</span><span>Yanlış defteri</span></div>
  <div class="phone back"><img src="shots/raw-rota.png" alt=""></div>
  <div class="phone front"><img src="shots/raw-home.png" alt=""></div>
</body></html>
