<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Maraton logo önerileri</title>
<style>
  @font-face { font-family: Unbounded; src: url(../../../assets/fonts/Unbounded_600.ttf); font-weight: 600; }
  @font-face { font-family: Archivo; src: url(../../../assets/fonts/Archivo_500.ttf); font-weight: 500; }
  @font-face { font-family: Bricolage; src: url(../../../assets/fonts/Bricolage_400.ttf); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1600px; background: #15151B; color: #ECE8E4; font-family: Archivo; padding: 56px 64px 64px; }
  h1 { font: 400 44px Bricolage; letter-spacing: -.03em; }
  .sub { color: #A3A0AB; font-size: 18px; margin-top: 8px; }
  .row { display: grid; grid-template-columns: 250px 110px 250px 1fr; gap: 40px; align-items: center; padding: 34px 0; border-top: 1px solid #2E2E36; }
  .row:first-of-type { margin-top: 36px; }
  .tile { width: 220px; height: 220px; border-radius: 50px; background: radial-gradient(circle at 78% 12%, rgba(229,52,63,.38), transparent 58%), #1C1C23; border: 1px solid #3A3A42; display: flex; align-items: center; justify-content: center; }
  .tile svg { width: 150px; height: 150px; }
  .small { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .s60 { width: 60px; height: 60px; border-radius: 14px; background: #1C1C23; border: 1px solid #3A3A42; display: flex; align-items: center; justify-content: center; }
  .s60 svg { width: 42px; height: 42px; }
  .s32 { width: 32px; height: 32px; border-radius: 8px; background: #1C1C23; border: 1px solid #3A3A42; display: flex; align-items: center; justify-content: center; }
  .s32 svg { width: 23px; height: 23px; }
  .light { width: 220px; height: 220px; border-radius: 50px; background: #F4F1EC; display: flex; align-items: center; justify-content: center; }
  .light svg { width: 150px; height: 150px; }
  .info .lock { display: flex; align-items: center; gap: 18px; }
  .info .lock svg { width: 56px; height: 56px; }
  .info .lock span { font: 600 34px Unbounded; letter-spacing: .04em; }
  .info b { display: block; font: 400 30px Bricolage; letter-spacing: -.02em; margin-top: 22px; }
  .info p { color: #B0ADB5; font-size: 17px; line-height: 1.5; margin-top: 8px; max-width: 620px; }
  .tag { display: inline-block; font-size: 13px; letter-spacing: .14em; color: #FF6A72; margin-top: 0; }
</style></head>
<body>
<h1>Maraton — logo önerileri · 2. tur (harfsiz)</h1>
<div class="sub">Her satır: uygulama simgesi · küçük boyutlar (60 ve 32 px) · açık zeminde · yazıyla birlikte.</div>
<div id="rows"></div>
<script>
const R = '#E5343F';
// ink: koyu zeminde #F4F1EC, acik zeminde #1C1C23
const MARKS = {
  F: (ink) => `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 72 L36 46 L52 62 L78 30" stroke="${ink}" stroke-width="12"/>
    <circle cx="78" cy="30" r="13" fill="${R}"/><circle cx="78" cy="30" r="5" fill="${ink === '#F4F1EC' ? '#1C1C23' : '#F4F1EC'}"/></svg>`,
  G: (ink) => `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round">
    <path d="M22 58 C22 26 78 26 78 60" stroke="${ink}" stroke-width="11" stroke-linecap="butt"/>
    <circle cx="22" cy="72" r="9" fill="none" stroke="${ink}" stroke-width="7"/>
    <circle cx="78" cy="68" r="11" fill="${R}"/></svg>`,
  H: (ink) => `<svg viewBox="0 0 100 100">
    <rect x="14" y="54" width="15" height="28" rx="7.5" fill="${ink}" fill-opacity=".45"/>
    <rect x="34" y="40" width="15" height="42" rx="7.5" fill="${ink}" fill-opacity=".7"/>
    <rect x="54" y="48" width="15" height="34" rx="7.5" fill="${ink}"/>
    <rect x="74" y="20" width="15" height="62" rx="7.5" fill="${R}"/></svg>`,
  I: (ink) => `<svg viewBox="0 0 100 100" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 80 L46 26 Q50 20 54 26 L88 80 Z" fill="${ink}" stroke="${ink}" stroke-width="6"/>
    <path d="M30 80 C44 72 36 60 50 54 S56 40 50 30" fill="none" stroke="${R}" stroke-width="7"/>
    <circle cx="50" cy="28" r="7" fill="${R}"/></svg>`,
  J: (ink) => `<svg viewBox="0 0 100 100" stroke-linejoin="round">
    <path d="M14 78 L34 26 H52 L32 78 Z" fill="${ink}" stroke="${ink}" stroke-width="5"/>
    <path d="M48 78 L68 26 H86 L66 78 Z" fill="${R}" stroke="${R}" stroke-width="5"/>
    <path d="M34 26 H52 L66 78 H48 Z" fill="${ink}" fill-opacity=".55" stroke="none"/></svg>`,
  K: (ink) => `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round">
    <path d="M50 16 A34 34 0 1 0 84 50" stroke="${ink}" stroke-width="12"/>
    <circle cx="80" cy="24" r="10" fill="${R}"/></svg>`,
};
const TEXT = {
  F: ['F · KIRIK ROTA', 'Yükselen rota, sonunda varış', 'Uygulamadaki rota grafiğinin kendisi: iki kırılmayla yükselen bir çizgi ve varış durağı. Dikkatli bakan içinde yatık bir M görür, ama ilk okunan şey "yükseliş".'],
  G: ['G · İKİ DURAK', 'Başlangıç ve varış arasında yay', 'Boş halka başlangıç, dolu kırmızı nokta varış; aralarında tek bir yol. Harf yok. En sade ve en "rota" olanı.'],
  H: ['H · ÇUBUKLAR', 'Haftalık çubuklar, sonuncusu kırmızı', 'Ana sayfadaki haftalık çalışma çubukları. İlerleme ve seri fikrini taşır; son çubuk hedefi geçmiş. Harf yok.'],
  I: ['I · ZİRVE YOLU', 'Tek tepe, içinde kıvrılan yol', 'Bir zirve ve ona tırmanan kırmızı patika. "Hedefe giden yol" fikrini en doğrudan anlatan; dolu şekil olduğu için simgede ağır durur.'],
  J: ['J · KURDELE', 'Katlanan şerit', 'İki kez katlanan bir şerit; ikinci kat kırmızı. Soyut ve geometrik. M çağrışımı çok hafif, daha çok bir "iz" ya da "kulvar" gibi okunur.'],
  K: ['K · TUR', 'Açık halka ve işaret noktası', 'Pistte bir tur: tamamlanmak üzere olan halka ve varış noktası. Aynı zamanda ilerleme halkası ve zamanlayıcı. Harf yok, en az parçalı olan.'],
};
document.getElementById('rows').innerHTML = Object.keys(MARKS).map((k) => `
  <div class="row">
    <div class="tile">${MARKS[k]('#F4F1EC')}</div>
    <div class="small"><div class="s60">${MARKS[k]('#F4F1EC')}</div><div class="s32">${MARKS[k]('#F4F1EC')}</div></div>
    <div class="light">${MARKS[k]('#1C1C23')}</div>
    <div class="info">
      <div class="lock">${MARKS[k]('#F4F1EC')}<span>MARATON</span></div>
      <span class="tag" style="display:block;margin-top:22px">${TEXT[k][0]}</span>
      <b style="margin-top:6px">${TEXT[k][1]}</b>
      <p>${TEXT[k][2]}</p>
    </div>
  </div>`).join('');
</script>
</body></html>
