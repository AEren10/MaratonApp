<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Maraton logo önerileri</title>
<style>
  @font-face { font-family: Unbounded; src: url(../../../assets/fonts/Unbounded_600.ttf); font-weight: 600; }
  @font-face { font-family: Archivo; src: url(../../../assets/fonts/Archivo_500.ttf); font-weight: 500; }
  @font-face { font-family: Bricolage; src: url(../../../assets/fonts/Bricolage_400.ttf); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1600px; background: #15151B; color: #ECE8E4; font-family: Archivo; padding: 56px 64px 64px; }
  h1 { font: 400 44px Bricolage; letter-spacing: -.03em; }
  .sub { color: #A3A0AB; font-size: 18px; margin-top: 8px; }
  .row { display: grid; grid-template-columns: 250px 110px 250px 1fr; gap: 40px; align-items: center; padding: 34px 0; border-top: 1px solid #2E2E36; }
  .row:first-of-type { margin-top: 36px; }
  .tile { width: 220px; height: 220px; border-radius: 50px; background: radial-gradient(circle at 78% 12%, rgba(229,52,63,.38), transparent 58%), #1C1C23; border: 1px solid #3A3A42; display: flex; align-items: center; justify-content: center; }
  .tile svg { width: 150px; height: 150px; }
  .small { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .s60 { width: 60px; height: 60px; border-radius: 14px; background: #1C1C23; border: 1px solid #3A3A42; display: flex; align-items: center; justify-content: center; }
  .s60 svg { width: 42px; height: 42px; }
  .s32 { width: 32px; height: 32px; border-radius: 8px; background: #1C1C23; border: 1px solid #3A3A42; display: flex; align-items: center; justify-content: center; }
  .s32 svg { width: 23px; height: 23px; }
  .light { width: 220px; height: 220px; border-radius: 50px; background: #F4F1EC; display: flex; align-items: center; justify-content: center; }
  .light svg { width: 150px; height: 150px; }
  .info .lock { display: flex; align-items: center; gap: 18px; }
  .info .lock svg { width: 56px; height: 56px; }
  .info .lock span { font: 600 34px Unbounded; letter-spacing: .04em; }
  .info b { display: block; font: 400 30px Bricolage; letter-spacing: -.02em; margin-top: 22px; }
  .info p { color: #B0ADB5; font-size: 17px; line-height: 1.5; margin-top: 8px; max-width: 620px; }
  .tag { display: inline-block; font-size: 13px; letter-spacing: .14em; color: #FF6A72; margin-top: 0; }
</style></head>
<body>
<h1>Maraton — logo önerileri · 3. tur (seçtiklerin + karışımlar)</h1>
<div class="sub">Her satır: uygulama simgesi · küçük boyutlar (60 ve 32 px) · açık zeminde · yazıyla birlikte.</div>
<div id="rows"></div>
<script>
const R = '#E5343F';
// ink: koyu zeminde #F4F1EC, acik zeminde #1C1C23
const DEEP = '#B3222C';
const MARKS = {
  B2: (ink) => `<svg viewBox="0 0 100 100" stroke-linejoin="round">
    <path d="M10 78 L33 34 Q37 27 41 34 L64 78 Z" fill="${ink}" stroke="${ink}" stroke-width="8"/>
    <path d="M38 78 L63 24 Q67 17 71 24 L92 78 Z" fill="${R}" stroke="${R}" stroke-width="8"/>
    <path d="M38 78 L51 54 L64 78 Z" fill="${DEEP}" stroke="${DEEP}" stroke-width="3"/></svg>`,
  C2: (ink) => `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 78 V50 a16 16 0 0 1 32 0 V78" stroke="${ink}" stroke-width="14"/>
    <path d="M50 50 a16 16 0 0 1 32 0 V56" stroke="${ink}" stroke-width="14"/>
    <circle cx="82" cy="77" r="8.5" fill="${R}"/></svg>`,
  H2: (ink) => `<svg viewBox="0 0 100 100">
    <rect x="16" y="40" width="19" height="42" rx="9.5" fill="${ink}" fill-opacity=".55"/>
    <rect x="40.5" y="54" width="19" height="28" rx="9.5" fill="${ink}"/>
    <rect x="65" y="20" width="19" height="62" rx="9.5" fill="${R}"/></svg>`,
  X1: (ink) => `<svg viewBox="0 0 100 100">
    <path d="M14 82 V52 a15 15 0 0 1 30 0 V82 Z" fill="${ink}"/>
    <path d="M35 82 V40 a15 15 0 0 1 30 0 V82 Z" fill="${ink}" fill-opacity=".6"/>
    <path d="M56 82 V30 a15 15 0 0 1 30 0 V82 Z" fill="${R}"/></svg>`,
  X2: (ink) => `<svg viewBox="0 0 100 100">
    <rect x="12" y="56" width="13" height="26" rx="6.5" fill="${ink}" fill-opacity=".5"/>
    <rect x="28.5" y="34" width="13" height="48" rx="6.5" fill="${ink}"/>
    <rect x="45" y="50" width="13" height="32" rx="6.5" fill="${ink}" fill-opacity=".75"/>
    <rect x="61.5" y="20" width="13" height="62" rx="6.5" fill="${R}"/>
    <rect x="78" y="48" width="13" height="34" rx="6.5" fill="${R}" fill-opacity=".55"/></svg>`,
};
const TEXT = {
  B2: ['İKİ ZİRVE · inceltilmiş', 'Yumuşak tepeli iki zirve', 'İlk turdaki 2 numara. Tepeler yuvarlatıldı, kırmızı zirve biraz daha yüksek: "bugün" ve "hedef". Kesişim koyu kırmızı.'],
  C2: ['KÜÇÜK m · inceltilmiş', 'Daha dolgun kemerler', 'İlk turdaki 3 numara. Çizgi kalınlaştı, kemerler genişledi; küçük boyutta daha güçlü duruyor. Harf olduğu belli ama yumuşak.'],
  H2: ['ÇUBUKLAR · inceltilmiş', 'Üç çubuk, sonuncusu hedefi geçmiş', 'İkinci turdaki 3 numara. Dört çubuk sinyal göstergesine benziyordu; üçe indi ve sıra düzensiz (orta, kısa, uzun) oldu. Ana sayfadaki haftalık çubuklarla aynı dil.'],
  X1: ['KARIŞIM 1 · kemer çubuklar', 'Yükselen üç kemer', 'm\'nin kemerleri ile çubukların birleşimi: üst üste binen, giderek yükselen üç yuvarlak kemer. Harf net değil; tepeler, çubuklar ve yükseliş aynı şekilde.'],
  X2: ['KARIŞIM 2 · iki zirveli çubuklar', 'Çubuklardan iki tepe', 'Beş çubuk iki zirve çiziyor; ikinci zirve kırmızı ve daha yüksek. İki zirve fikri ile haftalık çubuklar bir arada. M ancak arayan görür.'],
};
document.getElementById('rows').innerHTML = Object.keys(MARKS).map((k) => `
  <div class="row">
    <div class="tile">${MARKS[k]('#F4F1EC')}</div>
    <div class="small"><div class="s60">${MARKS[k]('#F4F1EC')}</div><div class="s32">${MARKS[k]('#F4F1EC')}</div></div>
    <div class="light">${MARKS[k]('#1C1C23')}</div>
    <div class="info">
      <div class="lock">${MARKS[k]('#F4F1EC')}<span>MARATON</span></div>
      <span class="tag" style="display:block;margin-top:22px">${TEXT[k][0]}</span>
      <b style="margin-top:6px">${TEXT[k][1]}</b>
      <p>${TEXT[k][2]}</p>
    </div>
  </div>`).join('');
</script>
</body></html>
