<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Maraton logo önerileri</title>
<style>
  @font-face { font-family: Unbounded; src: url(../../../assets/fonts/Unbounded_600.ttf); font-weight: 600; }
  @font-face { font-family: Archivo; src: url(../../../assets/fonts/Archivo_500.ttf); font-weight: 500; }
  @font-face { font-family: Bricolage; src: url(../../../assets/fonts/Bricolage_400.ttf); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1600px; background: #15151B; color: #ECE8E4; font-family: Archivo; padding: 56px 64px 64px; }
  h1 { font: 400 44px Bricolage; letter-spacing: -.03em; }
  .sub { color: #A3A0AB; font-size: 18px; margin-top: 8px; }
  .row { display: grid; grid-template-columns: 250px 110px 250px 1fr; gap: 40px; align-items: center; padding: 34px 0; border-top: 1px solid #2E2E36; }
  .row:first-of-type { margin-top: 36px; }
  .tile { width: 220px; height: 220px; border-radius: 50px; background: radial-gradient(circle at 78% 12%, rgba(229,52,63,.38), transparent 58%), #1C1C23; border: 1px solid #3A3A42; display: flex; align-items: center; justify-content: center; }
  .tile svg { width: 150px; height: 150px; }
  .small { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .s60 { width: 60px; height: 60px; border-radius: 14px; background: #1C1C23; border: 1px solid #3A3A42; display: flex; align-items: center; justify-content: center; }
  .s60 svg { width: 42px; height: 42px; }
  .s32 { width: 32px; height: 32px; border-radius: 8px; background: #1C1C23; border: 1px solid #3A3A42; display: flex; align-items: center; justify-content: center; }
  .s32 svg { width: 23px; height: 23px; }
  .light { width: 220px; height: 220px; border-radius: 50px; background: #F4F1EC; display: flex; align-items: center; justify-content: center; }
  .light svg { width: 150px; height: 150px; }
  .info .lock { display: flex; align-items: center; gap: 18px; }
  .info .lock svg { width: 56px; height: 56px; }
  .info .lock span { font: 600 34px Unbounded; letter-spacing: .04em; }
  .info b { display: block; font: 400 30px Bricolage; letter-spacing: -.02em; margin-top: 22px; }
  .info p { color: #B0ADB5; font-size: 17px; line-height: 1.5; margin-top: 8px; max-width: 620px; }
  .tag { display: inline-block; font-size: 13px; letter-spacing: .14em; color: #FF6A72; margin-top: 0; }
</style></head>
<body>
<h1>Maraton — logo önerileri · 6. tur (yükseliş, harfsiz, yeni fikirler)</h1>
<div class="sub">Her satır: uygulama simgesi · küçük boyutlar (60 ve 32 px) · açık zeminde · yazıyla birlikte.</div>
<div id="rows"></div>
<script>
const R = '#E5343F';
// ink: koyu zeminde #F4F1EC, acik zeminde #1C1C23
const MARKS = {
  W1: (ink) => `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round">
    <path d="M18 78 C40 74 52 62 60 48 S74 26 82 22" stroke="${ink}" stroke-opacity=".28" stroke-width="5"/>
    <circle cx="18" cy="78" r="6" fill="${ink}" fill-opacity=".5"/>
    <circle cx="38" cy="68" r="8" fill="${ink}" fill-opacity=".75"/>
    <circle cx="59" cy="50" r="10.5" fill="${ink}"/>
    <circle cx="80" cy="24" r="14" fill="${R}"/></svg>`,
  W2: (ink) => `<svg viewBox="0 0 100 100">
    <path d="M10 82 V66 a6 6 0 0 1 6 -6 H36 V82 Z" fill="${ink}" fill-opacity=".5"/>
    <path d="M36 82 V48 a6 6 0 0 1 6 -6 H62 V82 Z" fill="${ink}"/>
    <path d="M62 82 V26 a6 6 0 0 1 6 -6 H84 a6 6 0 0 1 6 6 V76 a6 6 0 0 1 -6 6 Z" fill="${R}"/></svg>`,
  W3: (ink) => `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round">
    <path d="M14 80 C42 80 44 58 54 48 S72 34 82 22" stroke="${ink}" stroke-width="19"/>
    <path d="M18 80 C42 79 46 60 55 50 S70 37 77 28" stroke="#1C1C23" stroke-opacity="${ink === '#F4F1EC' ? .55 : 0}" stroke-width="2.5" stroke-dasharray="1 8"/>
    <path d="M18 80 C42 79 46 60 55 50 S70 37 77 28" stroke="#F4F1EC" stroke-opacity="${ink === '#F4F1EC' ? 0 : .7}" stroke-width="2.5" stroke-dasharray="1 8"/>
    <circle cx="82" cy="22" r="12" fill="${R}"/></svg>`,
  W4: (ink) => `<svg viewBox="0 0 100 100">
    <path d="M8 82 V64 a11 11 0 0 1 22 0 V82 Z" fill="${ink}" fill-opacity=".4"/>
    <path d="M26 82 V52 a11 11 0 0 1 22 0 V82 Z" fill="${ink}" fill-opacity=".65"/>
    <path d="M44 82 V40 a11 11 0 0 1 22 0 V82 Z" fill="${ink}"/>
    <path d="M62 82 V27 a13 13 0 0 1 26 0 V82 Z" fill="${R}"/></svg>`,
  W5: (ink) => `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round">
    <path d="M22 82 A60 60 0 0 1 82 22" stroke="${R}" stroke-width="11"/>
    <path d="M42 82 A40 40 0 0 1 82 42" stroke="${ink}" stroke-width="11"/>
    <path d="M62 82 A20 20 0 0 1 82 62" stroke="${ink}" stroke-opacity=".5" stroke-width="11"/></svg>`,
};
const TEXT = {
  W1: ['1 · BÜYÜYEN DURAKLAR', 'Yükselen yolda giderek büyüyen duraklar', 'Çubuk yerine uygulamanın kendi öğesi: duraklar. Dört durak bir yokuşu tırmanıyor, her biri öncekinden büyük, sonuncusu kırmızı. Yükseliş var, başka hiçbir uygulamanın simgesine benzemiyor.'],
  W2: ['2 · BASAMAKLAR', 'Üç basamak, en üstteki kırmızı', 'Çubuklar birleşip merdivene dönüştü: "her gün bir adım daha". Dolu ve ağır bir simge. Düz çubuklardan daha az "sinyal göstergesi".'],
  W3: ['3 · YÜKSELEN YOL', 'Kıvrılarak yükselen yol ve varış', 'Kalın bir yol şeridi, ortasında şerit çizgisi, sonunda varış noktası. Maratonun kendisi: yol. Yükseliş ve rota aynı şekilde.'],
  W4: ['4 · YÜKSELEN KEMERLER', 'Dört adımda yükselen kemerler', 'Önceki turdan. Çubukların yumuşak hali; tek parça olduğu için küçük boyutta dağılmıyor.'],
  W5: ['5 · VİRAJ', 'Pist virajı: üç kulvar', 'Koşu pistinin virajı; dış kulvar kırmızı. Yükselişten çok "pist ve tur" fikri. Dikkat: kablosuz bağlantı simgesini andırabilir.'],
};
document.getElementById('rows').innerHTML = Object.keys(MARKS).map((k) => `
  <div class="row">
    <div class="tile">${MARKS[k]('#F4F1EC')}</div>
    <div class="small"><div class="s60">${MARKS[k]('#F4F1EC')}</div><div class="s32">${MARKS[k]('#F4F1EC')}</div></div>
    <div class="light">${MARKS[k]('#1C1C23')}</div>
    <div class="info">
      <div class="lock">${MARKS[k]('#F4F1EC')}<span>MARATON</span></div>
      <span class="tag" style="display:block;margin-top:22px">${TEXT[k][0]}</span>
      <b style="margin-top:6px">${TEXT[k][1]}</b>
      <p>${TEXT[k][2]}</p>
    </div>
  </div>`).join('');
</script>
</body></html>
